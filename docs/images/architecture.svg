<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">SecureScan architecture and assessment data flow</title>
  <desc id="desc">An authorized user interacts with a Flask interface. New targets pass through validation, a controlled Nmap scanner, a rule-based analyzer, and SQLite persistence. Saved records feed historical detail, HTML reports, and PDF reports. Gunicorn and Docker provide the runtime, with a health endpoint and persistent SQLite volume.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#10243d"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { fill: #f8fafc; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #bae6fd; font: 400 16px Arial, sans-serif; }
      .section { fill: #93c5fd; font: 700 13px Arial, sans-serif; letter-spacing: 1.4px; }
      .box { fill: #111f33; stroke: #38bdf8; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .box-data { fill: #16243a; stroke: #a78bfa; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .box-output { fill: #122a2c; stroke: #34d399; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .label { fill: #f8fafc; font: 700 17px Arial, sans-serif; text-anchor: middle; }
      .detail { fill: #cbd5e1; font: 400 12px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #67e8f9; stroke-width: 2.5; marker-end: url(#arrow); }
      .runtime { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; rx: 20; }
      .note { fill: #0f1b2c; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
      .note-title { fill: #fbbf24; font: 700 14px Arial, sans-serif; }
      .note-text { fill: #e2e8f0; font: 400 13px Arial, sans-serif; }
      .small-arrow { fill: none; stroke: #a78bfa; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="920" fill="url(#background)"/>
  <rect x="0" y="0" width="1440" height="116" fill="url(#header)"/>
  <text class="title" x="64" y="57">SecureScan Architecture</text>
  <text class="subtitle" x="64" y="87">Authorized, bounded assessment flow with stored-data reporting</text>

  <rect class="runtime" x="208" y="142" width="1170" height="610"/>
  <text class="section" x="234" y="174">DOCKER RUNTIME · GUNICORN · NON-ROOT APPLICATION USER</text>

  <text class="section" x="64" y="226">ENTRY</text>
  <rect class="box" x="40" y="246" width="180" height="98"/>
  <text class="label" x="130" y="285">Authorized User</text>
  <text class="detail" x="130" y="310">Single approved target</text>

  <rect class="box" x="270" y="246" width="200" height="98"/>
  <text class="label" x="370" y="282">Flask Web</text>
  <text class="label" x="370" y="305">Interface</text>
  <text class="detail" x="370" y="328">Dashboard and routes</text>

  <rect class="box" x="520" y="246" width="200" height="98"/>
  <text class="label" x="620" y="282">Target</text>
  <text class="label" x="620" y="305">Validation</text>
  <text class="detail" x="620" y="328">Normalize one host</text>

  <rect class="box" x="770" y="246" width="210" height="98"/>
  <text class="label" x="875" y="282">Controlled Nmap</text>
  <text class="label" x="875" y="305">Scanner</text>
  <text class="detail" x="875" y="328">Fixed conservative profile</text>

  <rect class="box" x="1030" y="246" width="210" height="98"/>
  <text class="label" x="1135" y="282">Rule-Based</text>
  <text class="label" x="1135" y="305">Analyzer</text>
  <text class="detail" x="1135" y="328">Explainable observations</text>

  <path class="arrow" d="M220 295 H266"/>
  <path class="arrow" d="M470 295 H516"/>
  <path class="arrow" d="M720 295 H766"/>
  <path class="arrow" d="M980 295 H1026"/>

  <text class="section" x="544" y="415">PERSISTENCE AND SAVED-DATA OUTPUTS</text>
  <rect class="box-data" x="530" y="438" width="240" height="108"/>
  <text class="label" x="650" y="477">SQLite Persistence</text>
  <text class="detail" x="650" y="502">Scans · ports · findings</text>
  <text class="detail" x="650" y="522">Saved assessment records</text>

  <path class="arrow" d="M1135 344 V390 H650 V434"/>

  <rect class="box-output" x="340" y="615" width="220" height="98"/>
  <text class="label" x="450" y="651">Historical Scan</text>
  <text class="label" x="450" y="674">Detail</text>
  <text class="detail" x="450" y="697">No rescanning</text>

  <rect class="box-output" x="650" y="615" width="220" height="98"/>
  <text class="label" x="760" y="657">HTML Report</text>
  <text class="detail" x="760" y="684">From stored scan data</text>

  <rect class="box-output" x="960" y="615" width="220" height="98"/>
  <text class="label" x="1070" y="657">PDF Report</text>
  <text class="detail" x="1070" y="684">Generated in memory</text>

  <path class="small-arrow" d="M650 546 V580 H450 V611"/>
  <path class="small-arrow" d="M650 546 V580 H760 V611"/>
  <path class="small-arrow" d="M760 713 V735 H1070 V717"/>

  <rect class="box-data" x="1080" y="438" width="230" height="108"/>
  <text class="label" x="1195" y="477">Persistent Volume</text>
  <text class="detail" x="1195" y="502">/app/data/securescan.db</text>
  <text class="detail" x="1195" y="522">Survives recreation</text>
  <path class="small-arrow" d="M770 492 H1076"/>

  <rect class="box" x="250" y="438" width="200" height="108"/>
  <text class="label" x="350" y="477">Health Endpoint</text>
  <text class="detail" x="350" y="502">Process response only</text>
  <text class="detail" x="350" y="522">No scan side effects</text>
  <path class="arrow" d="M370 344 V434"/>

  <rect class="note" x="40" y="792" width="1360" height="94"/>
  <text class="note-title" x="68" y="824">SECURITY BOUNDARY</text>
  <text class="note-text" x="68" y="852">Authorized targets only</text>
  <text class="note-text" x="325" y="852">Top 100 TCP ports</text>
  <text class="note-text" x="565" y="852">No UDP scanning</text>
  <text class="note-text" x="785" y="852">No exploitation</text>
  <text class="note-text" x="995" y="852">No CVE correlation</text>
  <text class="note-text" x="1228" y="852">Manual verification required</text>
</svg>
