name: Bug report
description: Report a reproducible SecureScan defect using sanitized, authorized test data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include secrets, private infrastructure details, or public
        exploit instructions. Report security vulnerabilities using SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the defect and its impact.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data or a locally controlled, authorized environment.
      placeholder: |
        1. Start with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, browser, and native or Docker setup as relevant.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, usernames, paths, target data, and unrelated content before attaching evidence.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, personal data, private target details, and sensitive paths from this report.
          required: true
        - label: Reproducing this issue does not require scanning a target I do not own or have explicit authorization to assess.
          required: true
