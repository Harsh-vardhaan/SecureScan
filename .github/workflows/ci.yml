name: CI

on:
  push:
    branches:
      - main
      - phase-10-portfolio-phase
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      SECRET_KEY: ci-only-synthetic-secret-not-for-production
      SECURESCAN_DATABASE_PATH: ${{ runner.temp }}/securescan-ci.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run mocked unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Python packages
        run: python -m compileall backend scanner vulnerability database reports

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-synthetic-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build test-stage image
        run: docker build --target test -t securescan:test .

      - name: Run test-stage image
        run: docker run --rm -e SECRET_KEY=ci-only-synthetic-secret-not-for-production securescan:test
